name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package plugin
        run: |
          zip -r "/tmp/Altcha-${GITHUB_REF_NAME}.zip" Altcha \
            -x "Altcha/lib/.git" \
            -x "Altcha/lib/.git/*" \
            -x "Altcha/lib/.github/*" \
            -x "Altcha/lib/.gitattributes" \
            -x "Altcha/lib/.gitignore" \
            -x "Altcha/lib/.php-cs-fixer.dist.php" \
            -x "Altcha/lib/tests/*" \
            -x "Altcha/lib/examples/*" \
            -x "Altcha/lib/phpstan.neon" \
            -x "Altcha/lib/phpstan-baseline.neon" \
            -x "Altcha/lib/phpunit.xml.dist" \
            -x "Altcha/lib/CODE_OF_CONDUCT.md" \
            -x "Altcha/lib/CONTRIBUTING.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Altcha $GITHUB_REF_NAME" \
            --generate-notes \
            "/tmp/Altcha-${GITHUB_REF_NAME}.zip"
